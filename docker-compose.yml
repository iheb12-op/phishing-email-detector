version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: phishing-detector-db
    environment:
      POSTGRES_DB: phishing_detector
      POSTGRES_USER: phishing_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_env}
    ports:
      - "5432:5432"
    volumes:
      - phishing_detector_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishing_user -d phishing_detector"]
      interval: 5s
      timeout: 5s
      retries: 5

  # backend: added in Phase 11 (Security hardening + Docker) once the
  #   application is feature-complete and has a Dockerfile.
  # frontend: added in the same phase.

volumes:
  phishing_detector_pgdata:
